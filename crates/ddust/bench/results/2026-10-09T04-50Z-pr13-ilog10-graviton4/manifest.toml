run-id  = "2026-10-09T04-50Z-pr13-ilog10-graviton4"
purpose = "digit_count as u64::checked_ilog10, against the hand form the PR keeps"

[hardware]
model   = "Neoverse V2, MIDR 0x00000000410fd4f1"
machine = "c8g.8xlarge"
cpus    = "32"
caches  = "L1 data 64K, L1 instruction 64K, L2 unified 2048K, L3 unified 36864K"

[environment]
system                = "Linux-6.12.53-69.119.amzn2023.aarch64-aarch64-with-glibc2.34"
placement             = "taskset -c 12"
load-before           = "2.24 3.68 3.07"
load-after            = "2.22 3.65 3.07"
isolated-cpus         = "6-31"
perf-event-paranoid   = "2"
aslr                  = "0"
transparent-hugepages = "always madvise [never]"
governor              = "none visible"

[toolchain]
rustc    = "rustc 1.101.0-nightly (d080e7dff 2026-09-27)"
llvm     = "LLVM version: 23.1.1"
profile  = "bench: release with fat LTO, one codegen unit, panic = abort, no overflow checks"
flags    = "the workspace floor of .cargo/config.toml, v0 symbols, no merged functions"
features = "none"

[contenders]
"bigdecimal"                    = "0.4.11"
"darwin-kperf"                  = "0.1.1"
"decimal-rs"                    = "0.2.0"
"fastnum"                       = "0.7.5"
"fin_decimal"                   = "0.4.0"
"fixdec"                        = "0.1.0"
"fixed"                         = "1.31.0"
"fixnum"                        = "0.9.5"
"nexus-decimal"                 = "1.2.2"
"perf-event2"                   = "0.7.4"
"primitive_fixed_point_decimal" = "1.5.0"
"rust_decimal"                  = "1.43.0"

[parameters]
passes  = 2
filters = "format/narrow/predictable/ddust format/narrow/unpredictable/ddust format/wide/predictable/ddust format/wide/unpredictable/ddust"
inputs  = "SplitMix64 from fixed seeds: 1,024 predictable values, 65,536 unpredictable"
backend = "each pass TOML names it, in its first line"
