[package]
name                   = "ddust"
description            = "fixed-point decimals that leave no dust: exact, typed, as fast as the integers beneath them."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true
readme                 = "../../README.md"
keywords               = ["decimal", "fixed-point", "rounding", "no-std", "financial"]
categories             = ["mathematics", "finance", "no-std", "no-std::no-alloc"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
targets      = ["aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu"]

[features]
default = []

arbitrary        = ["dep:arbitrary"]
bytemuck         = ["dep:bytemuck"]
defmt            = ["dep:defmt"]
num-traits-02    = ["dep:num-traits"]
proptest         = ["dep:proptest"]
rand-09          = ["dep:rand"]
runtime-dispatch = []
serde            = ["dep:serde_core"]
zerocopy-08      = ["dep:zerocopy"]

[lints]
workspace = true

[dependencies]
# external
arbitrary  = { workspace = true, optional = true }
bytemuck   = { workspace = true, optional = true }
defmt      = { workspace = true, optional = true }
num-traits = { workspace = true, optional = true }
proptest   = { workspace = true, features = ["alloc", "no_std"], optional = true }
rand       = { workspace = true, optional = true }
serde_core = { workspace = true, optional = true }
zerocopy   = { workspace = true, optional = true }

[dev-dependencies]
# external
bytemuck   = { workspace = true }
proptest   = { workspace = true, features = ["std"] }
rand       = { workspace = true, features = ["thread_rng"] }
rstest     = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
serde_test = { workspace = true }
trybuild   = { workspace = true }
zerocopy   = { workspace = true }
